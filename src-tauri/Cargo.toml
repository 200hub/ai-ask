[package]
name = "ai-ask"
version = "0.0.1-beta.9"
description = "AI Ask - 一个简洁高效的AI问答助手"
authors = ["AI Ask Team"]
edition = "2021"

[lib]
name = "ai_ask_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "unstable"] }
tauri-plugin-opener = "2.7.3"
tauri-plugin-store = "2.5.1"
tauri-plugin-shell = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
log = "0.4.35"
env_logger = "0.11.11"
anyhow = "1.0.104"
semver = "1.0.28"
time = { version = "0.3.55", features = ["formatting"] }

# 仅桌面平台依赖
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.12.5", features = ["image-png"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
arboard = "3.7.0"
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "query",
    "native-tls",
    "system-proxy",
] }

# Android 平台依赖
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "rustls",
] }

# iOS 平台依赖
[target.'cfg(target_os = "ios")'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "rustls",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

[target.'cfg(target_os = "macos")'.dependencies]
rdev = "0.5.3"
accessibility = "0.2.0"
core-foundation = "0.10.1"
core-graphics = "0.25.0"

[dev-dependencies]
tempfile = "3.27.0"

# Debug profile 优化（用于 Android debug 构建）
[profile.dev]
opt-level = "s"  # 优化体积

[profile.dev.package."*"]
opt-level = "s"  # 依赖也优化体积

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
