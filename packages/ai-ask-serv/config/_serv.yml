server:
  host: ${HAI_SERV_SERVER_HOST:127.0.0.1}
  port: ${HAI_SERV_SERVER_PORT:1422}
http:
  apiPrefix: /api/v1
  trustedProxies: []
  docs: false
  openapi: false
  health:
    path: /health
    readyPath: /ready
cors:
  origin: ${HAI_SERV_CORS_ORIGIN:http://localhost:1420,http://127.0.0.1:1420}
  nativeOrigins: ${HAI_SERV_CORS_NATIVEORIGINS:tauri://localhost,http://tauri.localhost,https://tauri.localhost}
  credentials: true
  allowedHeaders:
    - Authorization
    - Content-Type
    - Accept-Language
    - X-Request-Client
    - X-Hai-Terminal
    - X-Hai-Token-Transport
  exposedHeaders:
    - X-Request-Id
# 当前客户端使用 HTTPS/Bearer；没有声明支持未接入的应用层加密传输。
transport: false
