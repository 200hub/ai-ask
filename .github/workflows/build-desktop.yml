name: Build Desktop Platforms

# PR 构建普通安装包；发布时按公开配置可选生成五平台签名更新包。
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        description: Commit to build. Defaults to the triggering ref.
        required: false
      signed_updates:
        type: boolean
        description: Enable optional signed updates for a trusted release only.
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}

    strategy:
      fail-fast: false # Continue building other platforms if one fails
      matrix:
        include:
          # Linux x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64

          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x64

          # Windows ARM64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: windows
            arch: arm64

          # macOS Intel
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos
            arch: intel
            updater_arch: x64

          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      # Get pnpm store directory for caching
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      # Cache pnpm store
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # Setup Rust toolchain
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cache Cargo dependencies
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/ai-ask-desktop/src-tauri
          cache-on-failure: true

      # Install Linux dependencies (only on Ubuntu)
      - name: Install Linux dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # Install frontend dependencies
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared API contract
        run: pnpm --filter ai-ask-contract build

      # Read app SemVer for artifact naming (all OS)
      - name: Read app version
        shell: bash
        run: |
          SEMVER=$(node -p "require('./package.json').version")
          echo "SEMVER=$SEMVER" >> $GITHUB_ENV

      - name: Configure optional signed desktop updates
        id: updater
        if: ${{ inputs.signed_updates && github.event_name != 'pull_request' }}
        shell: bash
        env:
          TAURI_UPDATE_PUBLIC_KEY: ${{ vars.TAURI_UPDATE_PUBLIC_KEY }}
          TAURI_UPDATE_FEED_URL: ${{ vars.TAURI_UPDATE_FEED_URL }}
        run: node .github/scripts/desktop-updates.mjs configure "apps/ai-ask-desktop/src-tauri/tauri.${{ matrix.platform }}.conf.json" "$TAURI_UPDATE_FEED_URL"

      # Build Tauri application (Windows: NSIS only)
      - name: Build Tauri application (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: pnpm --filter ai-ask-desktop tauri build --target ${{ matrix.target }} --bundles nsis

      - name: Build Tauri application (Linux/macOS)
        if: ${{ runner.os != 'Windows' }}
        run: pnpm --filter ai-ask-desktop tauri build --target ${{ matrix.target }}

      - name: Sign updater artifacts
        if: ${{ inputs.signed_updates && github.event_name != 'pull_request' && steps.updater.outputs.enabled == 'true' }}
        shell: bash
        env:
          TAURI_UPDATE_PUBLIC_KEY: ${{ vars.TAURI_UPDATE_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ASSET_BASE_URL: https://github.com/${{ github.repository }}/releases/download/v${{ env.SEMVER }}/
        run: node .github/scripts/desktop-updates.mjs sign "${{ matrix.platform }}" "${{ matrix.updater_arch || matrix.arch }}" "$SEMVER" "apps/ai-ask-desktop/src-tauri/target/${{ matrix.target }}/release/bundle" "updater-${{ matrix.platform }}-${{ matrix.arch }}" "$ASSET_BASE_URL"

      - name: Upload signed updater artifacts
        if: ${{ steps.updater.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.platform }}-${{ matrix.arch }}-${{ env.SEMVER }}
          path: updater-${{ matrix.platform }}-${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 5

      # Upload artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          # Keep artifact name showing original SemVer across all platforms
          name: ${{ matrix.platform }}-${{ matrix.arch }}-${{ env.SEMVER }}
          path: |
            apps/ai-ask-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/ai-ask-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            apps/ai-ask-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/ai-ask-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 5
