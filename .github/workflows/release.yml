name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve Release Version
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      pending: ${{ steps.version.outputs.pending }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Resolve version and source commit
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/validate-version.js --source-only
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::The pushed tag $GITHUB_REF_NAME does not match $tag in the source."
            exit 1
          fi

          releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          if jq -e --arg tag "$tag" 'any(.[][]; .tag_name == $tag and .draft == false)' <<< "$releases" > /dev/null; then
            echo "$tag already has a published Release."
            echo 'pending=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git show-ref --verify --quiet "refs/tags/$tag"; then
            sha=$(git rev-parse "refs/tags/$tag^{commit}")
            if ! git merge-base --is-ancestor "$sha" origin/main; then
              echo "::error::The existing tag $tag is outside main."
              exit 1
            fi
            git checkout --detach "$sha"
            GITHUB_REF_NAME="$tag" node .github/scripts/validate-version.js
          else
            sha=$(git rev-parse HEAD)
          fi

          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo 'pending=true'
          } >> "$GITHUB_OUTPUT"

  desktop:
    name: Build Desktop Platforms
    needs: prepare
    if: needs.prepare.outputs.pending == 'true'
    uses: ./.github/workflows/build-desktop.yml
    with:
      source_sha: ${{ needs.prepare.outputs.sha }}

  publish:
    name: Publish GitHub Release
    needs: [prepare, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-release-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Check installers and publish
        shell: bash
        run: |
          version=${TAG#v}
          shopt -s nullglob
          assets=()

          require_installer() {
            local expected=$1
            shift
            if [[ "$#" != 1 || ! -s "$1" ]]; then
              echo "::error::Expected one non-empty $expected installer."
              exit 1
            fi
            assets+=("$1")
          }

          require_installer 'Windows x64 NSIS' "artifacts/windows-x64-$version"/*.exe
          require_installer 'Windows ARM64 NSIS' "artifacts/windows-arm64-$version"/*.exe
          require_installer 'Linux x64 DEB' "artifacts/linux-x64-$version"/*.deb
          require_installer 'Linux x64 AppImage' "artifacts/linux-x64-$version"/*.AppImage
          require_installer 'macOS Intel DMG' "artifacts/macos-intel-$version"/*.dmg
          require_installer 'macOS Apple Silicon DMG' "artifacts/macos-arm64-$version"/*.dmg

          releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          state=$(jq -r --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)] | first | if . == null then "missing" elif .draft then "draft" else "published" end' <<< "$releases")
          if [[ "$state" == published ]]; then
            echo "$TAG already has a published Release."
            exit 0
          fi

          git fetch --tags origin
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            git tag "$TAG" "$SOURCE_SHA"
            git push origin "refs/tags/$TAG"
          fi
          if [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$SOURCE_SHA" ]]; then
            echo "::error::The existing tag $TAG does not point to the built commit $SOURCE_SHA."
            exit 1
          fi

          if [[ "$state" == missing ]]; then
            flags=()
            if [[ "${version%%+*}" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" --verify-tag --draft --generate-notes --title "AI Ask $TAG" "${flags[@]}"
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
          gh release edit "$TAG" --verify-tag --draft=false
          gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
