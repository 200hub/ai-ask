name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve Release Version
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      pending: ${{ steps.version.outputs.pending }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Resolve version and source commit
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/validate-version.js --source-only
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::The pushed tag $GITHUB_REF_NAME does not match $tag in the source."
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/$tag"; then
            sha=$(git rev-parse "refs/tags/$tag^{commit}")
            if ! git merge-base --is-ancestor "$sha" origin/main; then
              echo "::error::The existing tag $tag is outside main."
              exit 1
            fi
            git checkout --detach "$sha"
            GITHUB_REF_NAME="$tag" node .github/scripts/validate-version.js
          else
            sha=$(git rev-parse HEAD)
          fi

          pending=true
          releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          if jq -e --arg tag "$tag" 'any(.[][]; .tag_name == $tag and .draft == false)' <<< "$releases" > /dev/null; then
            echo "$tag already has a published Release; checking its update channel is still allowed."
            pending=false
          fi

          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "pending=$pending"
          } >> "$GITHUB_OUTPUT"

  desktop:
    name: Build Desktop Platforms
    needs: prepare
    if: needs.prepare.outputs.pending == 'true'
    uses: ./.github/workflows/build-desktop.yml
    with:
      source_sha: ${{ needs.prepare.outputs.sha }}
      signed_updates: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  publish:
    name: Publish GitHub Release
    needs: [prepare, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-release-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify and merge signed updater feed
        shell: bash
        env:
          TAURI_UPDATE_PUBLIC_KEY: ${{ vars.TAURI_UPDATE_PUBLIC_KEY }}
          TAURI_UPDATE_FEED_URL: ${{ vars.TAURI_UPDATE_FEED_URL }}
        run: |
          node .github/scripts/desktop-updates.mjs validate-config apps/ai-ask-desktop/src-tauri/tauri.conf.json "$TAURI_UPDATE_FEED_URL"
          shopt -s nullglob
          signed=(artifacts/updater-*-${TAG#v})
          if [[ ${#signed[@]} != 5 ]]; then
            echo '::error::Expected signed updater artifacts for all five desktop targets.'
            exit 1
          fi
          node .github/scripts/desktop-updates.mjs merge "${TAG#v}" artifacts/latest.json "${signed[@]}"
      - name: Check installers and publish
        shell: bash
        run: |
          version=${TAG#v}
          shopt -s nullglob globstar
          assets=()

          require_installer() {
            local expected=$1
            shift
            if [[ "$#" != 1 || ! -s "$1" ]]; then
              echo "::error::Expected one non-empty $expected installer."
              exit 1
            fi
            assets+=("$1")
          }

          require_installer 'Windows x64 NSIS' "artifacts/windows-x64-$version"/**/*.exe
          require_installer 'Windows ARM64 NSIS' "artifacts/windows-arm64-$version"/**/*.exe
          require_installer 'Linux x64 DEB' "artifacts/linux-x64-$version"/**/*.deb
          require_installer 'Linux x64 AppImage' "artifacts/linux-x64-$version"/**/*.AppImage
          require_installer 'macOS Intel DMG' "artifacts/macos-intel-$version"/**/*.dmg
          require_installer 'macOS Apple Silicon DMG' "artifacts/macos-arm64-$version"/**/*.dmg

          # 更新包与普通安装包分开下载和校验，避免复制的 exe 被算作第二个安装包。
          if [[ -f artifacts/latest.json ]]; then
            for directory in artifacts/updater-*-$version; do
              for file in "$directory"/*; do
                if [[ $(basename "$file") != latest.json ]]; then
                  assets+=("$file")
                fi
              done
            done
          fi

          releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          state=$(jq -r --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)] | first | if . == null then "missing" elif .draft then "draft" else "published" end' <<< "$releases")
          if [[ "$state" == published ]]; then
            echo "$TAG already has a published Release."
            exit 0
          fi

          git fetch --tags origin
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            git tag "$TAG" "$SOURCE_SHA"
            git push origin "refs/tags/$TAG"
          fi
          if [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$SOURCE_SHA" ]]; then
            echo "::error::The existing tag $TAG does not point to the built commit $SOURCE_SHA."
            exit 1
          fi

          if [[ "$state" == missing ]]; then
            flags=()
            if [[ "${version%%+*}" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" --verify-tag --draft --generate-notes --title "AI Ask $TAG" "${flags[@]}"
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
          # 版本化文件全部上传后才上传清单，最后一次性公开 draft。
          if [[ -f artifacts/latest.json ]]; then
            gh release upload "$TAG" artifacts/latest.json --clobber
          fi
          gh release edit "$TAG" --verify-tag --draft=false
          gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"

  update-channel:
    name: Advance Signed Desktop Update Channel
    needs: [prepare, publish]
    if: ${{ always() && needs.prepare.result == 'success' && (needs.publish.result == 'success' || needs.prepare.outputs.pending == 'false') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: desktop-updates-channel
      cancel-in-progress: false
      queue: max
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Publish the fixed prerelease update feed last
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_UPDATE_PUBLIC_KEY: ${{ vars.TAURI_UPDATE_PUBLIC_KEY }}
          TAURI_UPDATE_FEED_URL: ${{ vars.TAURI_UPDATE_FEED_URL }}
        run: |
          node .github/scripts/desktop-updates.mjs validate-config apps/ai-ask-desktop/src-tauri/tauri.conf.json "$TAURI_UPDATE_FEED_URL"
          expected_feed="https://github.com/$GITHUB_REPOSITORY/releases/download/desktop-updates/latest.json"
          if [[ "$TAURI_UPDATE_FEED_URL" != "$expected_feed" || -z "$TAURI_UPDATE_PUBLIC_KEY" ]]; then
            echo '::error::Configure the reviewed signing public key and fixed desktop-updates feed together.'
            exit 1
          fi
          mkdir -p channel/candidate channel/current
          git fetch --tags origin
          # 必须在通道互斥锁内重读，不能依赖构建开始时间或之前的 release 列表。
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > channel/releases.json
          gh release download "$TAG" --pattern latest.json --dir channel/candidate
          channel=$(jq '[.[][] | select(.tag_name == "desktop-updates")] | first' channel/releases.json)
          current=-
          if [[ "$channel" != null ]]; then
            if ! jq -e '.draft == false and .prerelease == true' <<< "$channel" > /dev/null; then
              echo '::error::The reserved desktop-updates release must be a published prerelease.'
              exit 1
            fi
            if jq -e 'any(.assets[]; .name == "latest.json")' <<< "$channel" > /dev/null; then
              gh release download desktop-updates --pattern latest.json --dir channel/current
              current=channel/current/latest.json
            fi
          fi
          node .github/scripts/desktop-updates.mjs channel-plan channel/candidate/latest.json "$current" channel/releases.json "$SOURCE_SHA" "$GITHUB_REPOSITORY" channel/plan.json
          if ! jq -e '.promote == true' channel/plan.json > /dev/null; then
            jq -r .reason channel/plan.json >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # 仅首次创建保留的通道 tag；不移动通道 tag，也不改动任何应用 v 标签。
          if [[ "$channel" == null ]]; then
            gh release create desktop-updates --target "$SOURCE_SHA" --prerelease --latest=false --title 'Desktop updates' --notes 'Signed desktop update feed. Versioned installers remain on their application releases.'
          fi
          gh release upload desktop-updates channel/candidate/latest.json --clobber
          echo "Advanced the fixed desktop update feed to $TAG." >> "$GITHUB_STEP_SUMMARY"
